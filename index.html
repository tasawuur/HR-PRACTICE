<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PeopleDesk – HR Practice System</title>
<style>
:root{--bg:#eef1f5;--cd:#fff;--tx:#17202e;--mu:#667286;--bd:#dde2ea;--ac:#1d4e89;--ac2:#e3edf8;--ok:#1f7a4d;--wn:#b36b00;--rd:#b3372b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151d;--cd:#192130;--tx:#e6ebf2;--mu:#8e9bb0;--bd:#2a3445;--ac:#6fa8e8;--ac2:#1c2d45;--ok:#4fc58a;--wn:#e8a64a;--rd:#ff8274;color-scheme:dark}}
:root[data-theme=dark]{--bg:#10151d;--cd:#192130;--tx:#e6ebf2;--mu:#8e9bb0;--bd:#2a3445;--ac:#6fa8e8;--ac2:#1c2d45;--ok:#4fc58a;--wn:#e8a64a;--rd:#ff8274;color-scheme:dark}
*{box-sizing:border-box}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:var(--ac);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}header span{opacity:.8;font-size:13px}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac2);color:var(--ac)}nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h2{margin:0 0 4px;font-size:22px}p.sub{margin:0 0 16px;color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}.stat b{display:block;font-size:26px}.stat small{color:var(--mu)}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px;font-weight:600}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);min-width:130px}
.btn{font:inherit;font-weight:600;border:1px solid var(--ac);background:var(--ac);color:#fff;padding:8px 14px;border-radius:7px;cursor:pointer}
.btn.sec{background:none;color:var(--ac)}.btn.sm{padding:4px 9px;font-size:13px}.btn.dg{border-color:var(--rd);background:none;color:var(--rd)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ac2);color:var(--ac)}
.tag.ok{color:var(--ok)}.tag.wn{color:var(--wn)}.tag.rd{color:var(--rd)}
.bar{display:flex;align-items:center;gap:10px;margin:6px 0}.bar i{display:block;height:10px;background:var(--ac);border-radius:5px}.bar span{min-width:110px}
.empty{color:var(--mu);padding:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#ov.on{display:flex}
#ov>div{background:var(--cd);color:var(--tx);border-radius:12px;padding:22px;max-width:480px;width:100%;max-height:90%;overflow:auto}
.ps td{border:0;padding:4px 0}.ps tr.t td{border-top:2px solid var(--tx);font-weight:700;padding-top:8px}
@media print{body *{visibility:hidden}#ov,#ov *{visibility:visible}#ov{position:absolute;background:none}}
</style></head><body>
<header><h1>PeopleDesk</h1><span>HR practice system – everything you enter is saved in this browser</span></header>
<nav id="nav"></nav><main id="v"></main><div id="ov"><div id="mb"></div></div>
<script>
const K='peopledesk1',DEPTS=['Front Office','Housekeeping','Food & Beverage','Accounts','HR','Sales'],LT=['Casual','Sick','Earned','Unpaid'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),td=()=>new Date().toISOString().slice(0,10);
const seed=()=>({id:10,emps:[{id:1,name:'Aarif Lone',dept:'Front Office',role:'Front Office Executive',sal:28000,joined:'2024-03-01'},{id:2,name:'Sana Mir',dept:'Housekeeping',role:'Supervisor',sal:24000,joined:'2023-06-15'},{id:3,name:'Imran Dar',dept:'Food & Beverage',role:'Chef de Partie',sal:42000,joined:'2022-11-10'},{id:4,name:'Zoya Khan',dept:'HR',role:'HR Executive',sal:36000,joined:'2024-08-01'}],att:{},leaves:[{id:5,emp:2,type:'Sick',from:td(),to:td(),status:'Pending'}],cands:[{id:6,name:'Riyaz Ahmad',role:'Receptionist',stage:'Interview'},{id:7,name:'Nusrat Jan',role:'Accountant',stage:'Applied'}]});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D||!D.emps)D=seed();
const ens=()=>{D.perf=D.perf||[];D.exp=D.exp||[];D.shifts=D.shifts||{};D.ann=D.ann||[{id:8,t:'Welcome',b:'Add, edit and delete anything here to practise.'}];D.hol=D.hol||[{id:9,d:'2026-12-25',n:'Christmas Day'},{id:3,d:'2027-01-26',n:'Republic Day'}];D.set=D.set||{co:'PeopleDesk',pf:12,pt:200}};ens();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let tab='dash',month=td().slice(0,7),adate=td(),q='',editId=null;
const nm=id=>(D.emps.find(e=>e.id==id)||{name:'(removed)'}).name,val=i=>$('#'+i).value;
const days=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const opt=(arr,s)=>arr.map(x=>`<option${x==s?' selected':''}>${esc(x)}</option>`).join('');
const empOpt=s=>D.emps.map(e=>`<option value="${e.id}"${e.id==s?' selected':''}>${esc(e.name)}</option>`).join('');
function calc(e,m){let ab=0;for(const d in D.att)if(d.startsWith(m)){const s=D.att[d][e.id];if(s=='A')ab++;if(s=='H')ab+=.5}
const lop=e.sal/30*ab,g=e.sal-lop,basic=g*.5,hra=g*.2,oth=g-basic-hra,pf=basic*D.set.pf/100,pt=g>15000?+D.set.pt:0,tds=e.sal*12>700000?g*.1:0;
return{ab,lop,g,basic,hra,oth,pf,pt,tds,net:g-pf-pt-tds}}
function csv(rows,f){const t=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
try{const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(t);a.download=f;a.click()}catch(e){modal('<p>Download is not available on this page. Copy the data instead:</p><textarea style="width:100%;height:200px">'+esc(t)+'</textarea>')}}
function modal(h){$('#mb').innerHTML=h+'<p><button class="btn sec" onclick="$(\'#ov\').classList.remove(\'on\')">Close</button></p>';$('#ov').classList.add('on')}
const V={
dash(){const m=td().slice(0,7),t=D.emps.reduce((a,e)=>a+calc(e,m).net,0),pend=D.leaves.filter(l=>l.status=='Pending'),ta=D.att[td()]||{},pr=Object.values(ta).filter(x=>x=='P').length,mx=Math.max(1,...DEPTS.map(d=>D.emps.filter(e=>e.dept==d).length));
return`<h2>Dashboard</h2><p class="sub">Snapshot of your team today.</p><div class="grid"><div class="stat"><b>${D.emps.length}</b><small>Employees</small></div><div class="stat"><b>${pr}/${D.emps.length}</b><small>Present today</small></div><div class="stat"><b>${pend.length}</b><small>Leave requests waiting</small></div><div class="stat"><b>${D.cands.filter(c=>c.stage!='Hired'&&c.stage!='Rejected').length}</b><small>Open candidates</small></div><div class="stat"><b>${inr(t)}</b><small>Net payroll this month</small></div></div>
<div class="card"><b>Headcount by department</b>${DEPTS.map(d=>{const n=D.emps.filter(e=>e.dept==d).length;return`<div class="bar"><span>${esc(d)}</span><i style="width:${n/mx*60+2}%"></i><b>${n}</b></div>`}).join('')}</div>
<div class="card"><b>Notices</b>${D.ann.slice(0,3).map(a=>`<p><b>${esc(a.t)}</b> – ${esc(a.b)}</p>`).join('')||'<p class="empty">No notices posted.</p>'}<p class="sub">Next holiday: ${(h=>h?h.n+' on '+h.d:'none added')(D.hol.find(h=>h.d>=td()))}. Expense claims waiting: ${D.exp.filter(x=>x.st=='Pending').length}.</p></div><div class="card"><b>Leave waiting for approval</b>${pend.length?pend.map(l=>`<p>${esc(nm(l.emp))} – ${l.type}, ${l.from} to ${l.to}</p>`).join(''):'<p class="empty">No requests waiting.</p>'}</div>`},
emps(){const e0=D.emps.find(e=>e.id==editId)||{},L=D.emps.filter(e=>(e.name+e.dept+e.role).toLowerCase().includes(q.toLowerCase()));
return`<h2>Employees</h2><p class="sub">Add, edit and remove staff records.</p><div class="card"><form onsubmit="return saveEmp()"><label>Name<input id="n" required value="${esc(e0.name)}"></label><label>Department<select id="d">${opt(DEPTS,e0.dept)}</select></label><label>Job title<input id="r" required value="${esc(e0.role)}"></label><label>Monthly salary (₹)<input id="s" type="number" min="0" required value="${e0.sal||''}"></label><label>Joining date<input id="j" type="date" required value="${e0.joined||td()}"></label><button class="btn">${editId?'Save changes':'Add employee'}</button>${editId?'<button type="button" class="btn sec" onclick="editId=null;R()">Cancel</button>':''}</form></div>
<div class="row"><label>Search<input value="${esc(q)}" oninput="q=this.value;R(1)" id="qs"></label><button class="btn sec" onclick="exEmp()">Export CSV</button></div><div class="card tw"><table><tr><th>Name<th>Department<th>Title<th class="n">Salary<th>Joined<th></tr>${L.map(e=>`<tr><td>${esc(e.name)}<td>${esc(e.dept)}<td>${esc(e.role)}<td class="n">${inr(e.sal)}<td>${e.joined}<td><button class="btn sec sm" onclick="editId=${e.id};R()">Edit</button> <button class="btn dg sm" onclick="delEmp(${e.id})">Delete</button></tr>`).join('')||'<tr><td class="empty">No matching employees.</tr>'}</table></div>`},
att(){const a=D.att[adate]||{},c=x=>D.emps.filter(e=>a[e.id]==x).length;
return`<h2>Attendance</h2><p class="sub">Mark each day. Absent and half days reduce pay in Payroll.</p><div class="row"><label>Date<input type="date" value="${adate}" onchange="adate=this.value;R()"></label><button class="btn sec" onclick="allP()">Mark all present</button></div><div class="grid"><div class="stat"><b>${c('P')}</b><small>Present</small></div><div class="stat"><b>${c('A')}</b><small>Absent</small></div><div class="stat"><b>${c('H')}</b><small>Half day</small></div><div class="stat"><b>${c('L')}</b><small>On leave</small></div></div>
<div class="card tw"><table><tr><th>Employee<th>Department<th>Status</tr>${D.emps.map(e=>`<tr><td>${esc(e.name)}<td>${esc(e.dept)}<td><select onchange="setA(${e.id},this.value)"><option value="">Not marked</option>${[['P','Present'],['A','Absent'],['H','Half day'],['L','On leave']].map(x=>`<option value="${x[0]}"${a[e.id]==x[0]?' selected':''}>${x[1]}</option>`).join('')}</select></tr>`).join('')||'<tr><td class="empty">Add employees first.</tr>'}</table></div>`},
leave(){return`<h2>Leave</h2><p class="sub">Request leave, then approve or reject it. Approved days appear in Attendance as On leave.</p><div class="card"><form onsubmit="return addL()"><label>Employee<select id="le">${empOpt()}</select></label><label>Type<select id="lt">${opt(LT)}</select></label><label>From<input id="lf" type="date" required value="${td()}"></label><label>To<input id="l2" type="date" required value="${td()}"></label><button class="btn">Submit request</button></form></div>
<div class="card tw"><b>Leave balance this year</b><table><tr><th>Employee${Object.keys(ALW).map(t=>`<th class="n">${t}`).join('')}</tr>${D.emps.map(e=>`<tr><td>${esc(e.name)}${Object.keys(ALW).map(t=>`<td class="n">${ALW[t]-D.leaves.filter(l=>l.emp==e.id&&l.type==t&&l.status=='Approved').reduce((a,l)=>a+days(l.from,l.to),0)}`).join('')}</tr>`).join('')}</table></div><div class="card tw"><table><tr><th>Employee<th>Type<th>From<th>To<th class="n">Days<th>Status<th></tr>${D.leaves.map(l=>`<tr><td>${esc(nm(l.emp))}<td>${l.type}<td>${l.from}<td>${l.to}<td class="n">${days(l.from,l.to)}<td><span class="tag ${l.status=='Approved'?'ok':l.status=='Rejected'?'rd':'wn'}">${l.status}</span><td>${l.status=='Pending'?`<button class="btn sm" onclick="decL(${l.id},'Approved')">Approve</button> <button class="btn dg sm" onclick="decL(${l.id},'Rejected')">Reject</button> `:''}<button class="btn sec sm" onclick="D.leaves=D.leaves.filter(x=>x.id!=${l.id});save();R()">Remove</button></tr>`).join('')||'<tr><td class="empty">No leave requests yet.</tr>'}</table></div>`},
pay(){const R2=D.emps.map(e=>[e,calc(e,month)]),T=k=>R2.reduce((a,x)=>a+x[1][k],0);
return`<h2>Payroll</h2><p class="sub">Salary split: 50% basic, 20% HRA, 30% allowances. Deductions: loss of pay (salary ÷ 30 per absent day), PF and professional tax at the rates set in Settings, and 10% TDS when annual pay exceeds ₹7 lakh. These are practice rules, not tax advice.</p><div class="row"><label>Month<input type="month" value="${month}" onchange="month=this.value;R()"></label><button class="btn sec" onclick="exPay()">Export CSV</button></div><div class="grid"><div class="stat"><b>${inr(T('g'))}</b><small>Gross pay</small></div><div class="stat"><b>${inr(T('pf')+T('pt')+T('tds'))}</b><small>Statutory deductions</small></div><div class="stat"><b>${inr(T('net'))}</b><small>Net payable</small></div></div>
<div class="card tw"><table><tr><th>Employee<th class="n">Absent days<th class="n">Gross<th class="n">PF<th class="n">Tax<th class="n">Net<th></tr>${R2.map(([e,c])=>`<tr><td>${esc(e.name)}<td class="n">${c.ab}<td class="n">${inr(c.g)}<td class="n">${inr(c.pf)}<td class="n">${inr(c.pt+c.tds)}<td class="n"><b>${inr(c.net)}</b><td><button class="btn sec sm" onclick="slip(${e.id})">Payslip</button></tr>`).join('')||'<tr><td class="empty">Add employees first.</tr>'}</table></div>`},
rec(){const S=['Applied','Interview','Offer','Hired','Rejected'];return`<h2>Recruitment</h2><p class="sub">Move candidates through the pipeline. Hired candidates can become employees.</p><div class="card"><form onsubmit="return addC()"><label>Candidate name<input id="cn" required></label><label>Position<input id="cr" required></label><button class="btn">Add candidate</button></form></div>
<div class="card tw"><table><tr><th>Name<th>Position<th>Stage<th></tr>${D.cands.map(c=>`<tr><td>${esc(c.name)}<td>${esc(c.role)}<td><select onchange="D.cands.find(x=>x.id==${c.id}).stage=this.value;save();R()">${opt(S,c.stage)}</select><td>${c.stage=='Hired'&&!c.conv?`<button class="btn sm" onclick="hire(${c.id})">Convert to employee</button> `:''}<button class="btn dg sm" onclick="D.cands=D.cands.filter(x=>x.id!=${c.id});save();R()">Delete</button></tr>`).join('')||'<tr><td class="empty">No candidates yet.</tr>'}</table></div><div class="card"><b>Reset</b><p class="sub">Clear everything and go back to the sample data.</p><button class="btn dg" onclick="if(confirm('Replace all data with the sample set?')){D=seed();ens();save();R()}">Reset demo data</button></div>`}};
const ALW={Casual:12,Sick:10,Earned:15},SH=['Off','Morning','Evening','Night'];let rw=td();
Object.assign(V,{
roster(){const w=[...Array(7)].map((_,i)=>{const d=new Date(rw);d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});
return`<h2>Shift roster</h2><p class="sub">Plan who works which shift each day. Changes save as you pick.</p><div class="row"><label>Week starting<input type="date" value="${rw}" onchange="rw=this.value;R()"></label></div><div class="card tw"><table><tr><th>Employee${w.map(d=>`<th>${d.slice(5)}`).join('')}</tr>${D.emps.map(e=>`<tr><td>${esc(e.name)}${w.map(d=>`<td><select onchange="setS('${d}',${e.id},this.value)">${opt(SH,D.shifts[d+'|'+e.id]||'Off')}</select>`).join('')}</tr>`).join('')||'<tr><td class="empty">Add employees first.</tr>'}</table></div>`},
perf(){return`<h2>Performance</h2><p class="sub">Record reviews, ratings and goals for each employee.</p><div class="card"><form onsubmit="return addP()"><label>Employee<select id="pe">${empOpt()}</select></label><label>Review period<input id="pp" required value="Q4 2026"></label><label>Rating (1-5)<select id="pr">${opt([5,4,3,2,1])}</select></label><label>Goals and feedback<input id="pg" required style="min-width:260px"></label><button class="btn">Save review</button></form></div><div class="card tw"><table><tr><th>Employee<th>Period<th>Rating<th>Goals and feedback<th></tr>${D.perf.map(p=>`<tr><td>${esc(nm(p.emp))}<td>${esc(p.per)}<td><span class="tag ${p.r>=4?'ok':p.r<3?'rd':'wn'}">${p.r}/5</span><td style="white-space:normal">${esc(p.fb)}<td><button class="btn dg sm" onclick="del('perf',${p.id})">Delete</button></tr>`).join('')||'<tr><td class="empty">No reviews yet.</tr>'}</table></div>`},
exp(){const t=s=>D.exp.filter(x=>x.st==s).reduce((a,x)=>a+x.amt,0);
return`<h2>Expenses</h2><p class="sub">Staff claims for travel, meals and supplies.</p><div class="grid"><div class="stat"><b>${inr(t('Pending'))}</b><small>Waiting for approval</small></div><div class="stat"><b>${inr(t('Approved'))}</b><small>Approved, not paid</small></div><div class="stat"><b>${inr(t('Paid'))}</b><small>Paid</small></div></div><div class="card"><form onsubmit="return addX()"><label>Employee<select id="xe">${empOpt()}</select></label><label>Category<select id="xc">${opt(['Travel','Meals','Supplies','Other'])}</select></label><label>Amount (₹)<input id="xa" type="number" min="1" required></label><label>Date<input id="xd" type="date" required value="${td()}"></label><button class="btn">Submit claim</button></form></div><div class="card tw"><table><tr><th>Employee<th>Category<th>Date<th class="n">Amount<th>Status<th></tr>${D.exp.map(x=>`<tr><td>${esc(nm(x.emp))}<td>${x.cat}<td>${x.date}<td class="n">${inr(x.amt)}<td><span class="tag ${x.st=='Paid'?'ok':x.st=='Rejected'?'rd':'wn'}">${x.st}</span><td>${x.st=='Pending'?`<button class="btn sm" onclick="decX(${x.id},'Approved')">Approve</button> <button class="btn dg sm" onclick="decX(${x.id},'Rejected')">Reject</button> `:''}${x.st=='Approved'?`<button class="btn sm" onclick="decX(${x.id},'Paid')">Mark paid</button> `:''}<button class="btn sec sm" onclick="del('exp',${x.id})">Remove</button></tr>`).join('')||'<tr><td class="empty">No claims yet.</tr>'}</table></div>`},
ann(){return`<h2>Notices and holidays</h2><p class="sub">Post announcements and keep the holiday calendar.</p><div class="card"><form onsubmit="return addN()"><label>Title<input id="nt" required></label><label>Message<input id="nb" required style="min-width:300px"></label><button class="btn">Post notice</button></form>${D.ann.map(a=>`<p><b>${esc(a.t)}</b> – ${esc(a.b)} <button class="btn dg sm" onclick="del('ann',${a.id})">Delete</button></p>`).join('')}</div><div class="card"><form onsubmit="return addH()"><label>Date<input id="hd" type="date" required></label><label>Holiday<input id="hn" required></label><button class="btn">Add holiday</button></form>${D.hol.map(h=>`<p>${h.d} – ${esc(h.n)} <button class="btn dg sm" onclick="del('hol',${h.id})">Delete</button></p>`).join('')}</div>`},
set(){return`<h2>Settings</h2><p class="sub">Company name and payroll rates.</p><div class="card"><form onsubmit="return saveSet()"><label>Company name<input id="sc" value="${esc(D.set.co)}"></label><label>PF rate (% of basic)<input id="sp" type="number" min="0" max="100" step="0.5" value="${D.set.pf}"></label><label>Professional tax (₹ per month)<input id="st" type="number" min="0" value="${D.set.pt}"></label><button class="btn">Save settings</button></form></div><div class="card"><b>Backup and restore</b><p class="sub">Copy your data to keep it safe, or paste a backup to restore it.</p><button class="btn sec" onclick="bk()">Show backup</button><p><textarea id="rj" style="width:100%;height:90px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:7px" placeholder="Paste backup here"></textarea></p><button class="btn" onclick="rest()">Restore from backup</button></div>`}});
function addP(){D.perf.unshift({id:D.id++,emp:+val('pe'),per:val('pp').trim(),r:+val('pr'),fb:val('pg').trim()});save();R();return false}
function addX(){D.exp.unshift({id:D.id++,emp:+val('xe'),cat:val('xc'),amt:+val('xa'),date:val('xd'),st:'Pending'});save();R();return false}
function addN(){D.ann.unshift({id:D.id++,t:val('nt').trim(),b:val('nb').trim()});save();R();return false}
function addH(){D.hol.push({id:D.id++,d:val('hd'),n:val('hn').trim()});D.hol.sort((a,b)=>a.d<b.d?-1:1);save();R();return false}
function decX(i,s){D.exp.find(x=>x.id==i).st=s;save();R()}
function del(k,i){D[k]=D[k].filter(x=>x.id!=i);save();R()}
function setS(d,i,v){D.shifts[d+'|'+i]=v;save()}
function saveSet(){D.set={co:val('sc').trim()||'PeopleDesk',pf:+val('sp'),pt:+val('st')};save();R();return false}
function bk(){modal('<textarea readonly style="width:100%;height:220px">'+esc(JSON.stringify(D))+'</textarea>')}
function rest(){try{const o=JSON.parse(val('rj'));if(!o.emps)throw 0;D=o;ens();save();R()}catch(e){modal('<p>That backup could not be read. Paste the full text from Show backup.</p>')}}
const TABS={dash:'Dashboard',emps:'Employees',att:'Attendance',leave:'Leave',roster:'Shift roster',pay:'Payroll',perf:'Performance',exp:'Expenses',rec:'Recruitment',ann:'Notices',set:'Settings'};
function R(keep){$('header h1').textContent=D.set.co;$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';editId=null;R()">${v}</button>`).join('');$('#v').innerHTML=V[tab]();if(keep){const i=$('#qs');if(i){i.focus();i.setSelectionRange(q.length,q.length)}}}
function saveEmp(){const o={name:val('n').trim(),dept:val('d'),role:val('r').trim(),sal:+val('s'),joined:val('j')};if(editId)Object.assign(D.emps.find(e=>e.id==editId),o);else D.emps.push({id:D.id++,...o});editId=null;save();R();return false}
function delEmp(i){if(!confirm('Delete '+nm(i)+' and their leave records?'))return;D.emps=D.emps.filter(e=>e.id!=i);D.leaves=D.leaves.filter(l=>l.emp!=i);save();R()}
function setA(i,s){(D.att[adate]=D.att[adate]||{})[i]=s;if(!s)delete D.att[adate][i];save();R()}
function allP(){D.att[adate]=D.att[adate]||{};D.emps.forEach(e=>D.att[adate][e.id]='P');save();R()}
function addL(){if(!D.emps.length){modal('<p>Add an employee before requesting leave.</p>');return false}const f=val('lf'),t=val('l2');if(t<f){modal('<p>The end date must be on or after the start date.</p>');return false}D.leaves.push({id:D.id++,emp:+val('le'),type:val('lt'),from:f,to:t,status:'Pending'});save();R();return false}
function decL(i,s){const l=D.leaves.find(x=>x.id==i);l.status=s;if(s=='Approved'&&l.type!='Unpaid')for(let d=new Date(l.from);d<=new Date(l.to);d.setDate(d.getDate()+1)){const k=d.toISOString().slice(0,10);(D.att[k]=D.att[k]||{})[l.emp]='L'}save();R()}
function addC(){D.cands.push({id:D.id++,name:val('cn').trim(),role:val('cr').trim(),stage:'Applied'});save();R();return false}
function hire(i){const c=D.cands.find(x=>x.id==i);c.conv=1;D.emps.push({id:D.id++,name:c.name,dept:'Front Office',role:c.role,sal:20000,joined:td()});save();tab='emps';R();modal('<p>'+esc(c.name)+' was added to Employees with a placeholder salary of ₹20,000 and department Front Office. Edit the record to set the real details.</p>')}
function slip(i){const e=D.emps.find(x=>x.id==i),c=calc(e,month),r=(a,b,t)=>`<tr${t?' class="t"':''}><td>${a}<td style="text-align:right">${inr(b)}</tr>`;
modal(`<h3 style="margin:0">Payslip – ${month}</h3><p>${esc(e.name)} · ${esc(e.role)} · ${esc(e.dept)}<br>Absent days: ${c.ab}</p><table class="ps"><tr><td colspan="2"><b>Earnings</b></tr>${r('Basic',c.basic)}${r('HRA',c.hra)}${r('Allowances',c.oth)}${r('Gross pay',c.g,1)}<tr><td colspan="2"><b>Deductions</b></tr>${r('Provident fund',c.pf)}${r('Professional tax',c.pt)}${r('TDS',c.tds)}${r('Net pay',c.net,1)}</table><p><button class="btn" onclick="window.print()">Print payslip</button></p>`)}
function exEmp(){csv([['Name','Department','Title','Salary','Joined'],...D.emps.map(e=>[e.name,e.dept,e.role,e.sal,e.joined])],'employees.csv')}
function exPay(){csv([['Employee','Absent days','Gross','PF','PT','TDS','Net'],...D.emps.map(e=>{const c=calc(e,month);return[e.name,c.ab,Math.round(c.g),Math.round(c.pf),c.pt,Math.round(c.tds),Math.round(c.net)]})],'payroll-'+month+'.csv')}
R();
</script></body></html>
